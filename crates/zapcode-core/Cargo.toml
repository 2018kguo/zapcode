[package]
name = "zapcode-core"
version = "2.0.0" # x-release-please-version
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A minimal, secure TypeScript subset interpreter — parse, compile, execute, snapshot"
readme = "../../README.md"
homepage = "https://github.com/TheUncharted/zapcode"
keywords = ["typescript", "interpreter", "sandbox", "ai", "mcp"]
categories = ["compilers", "wasm"]

[dependencies]
oxc_parser.workspace = true
oxc_ast.workspace = true
oxc_allocator.workspace = true
oxc_span.workspace = true
oxc_syntax.workspace = true
oxc_str.workspace = true
serde.workspace = true
postcard.workspace = true
sha2.workspace = true
miniz_oxide.workspace = true
regex.workspace = true
indexmap.workspace = true
rustc-hash.workspace = true
thiserror.workspace = true
unicode-normalization = "0.1.25"
num-bigint = { version = "0.5", features = ["serde"] }
num-traits = "0.2"
num-integer = "0.1"

[dev-dependencies]
insta.workspace = true
divan.workspace = true
indexmap.workspace = true
rustc-hash.workspace = true
sha2.workspace = true
miniz_oxide.workspace = true

[[bench]]
name = "execution"
harness = false

# Pre-existing stylistic/structural lints, suppressed package-wide (lib + tests
# + examples + benches) so CI's `cargo clippy -D warnings` passes. These predate
# the npm-scope rename; suppressed rather than churn load-bearing code
# (mutability rebinds, batch-snapshot closures) — tracked for separate cleanup.
[lints.clippy]
type_complexity = "allow"
large_enum_variant = "allow"
redundant_locals = "allow"
wrong_self_convention = "allow"
while_let_loop = "allow"
needless_range_loop = "allow"
doc_lazy_continuation = "allow"
field_reassign_with_default = "allow"
