[workspace]
members = [
    "crates/zapcode-core",
    "crates/zapcode-js",
    "crates/zapcode-py",
    "crates/zapcode-wasm",
]
exclude = [
    "examples/rust",
]
resolver = "2"

[workspace.package]
version = "1.6.2" # x-release-please-version
edition = "2021"
license = "MIT"
repository = "https://github.com/TheUncharted/zapcode"

[workspace.dependencies]
# Parser
oxc_parser = "0.155.0"
oxc_ast = "0.155.0"
oxc_allocator = "0.155.0"
oxc_span = "0.155.0"
oxc_syntax = "0.155.0"
oxc_str = "0.155.0"

# Serialization
serde = { version = "1.0.228", features = ["derive", "rc"] }
postcard = { version = "1.1.3", features = ["alloc"] }
sha2 = "0.11.1"
# Pure-Rust DEFLATE so snapshots stay compact on the wire (Temporal payloads,
# durable queues). Pure-Rust keeps the wasm target buildable, unlike zstd's C bindings.
miniz_oxide = "0.9.1"
# Linear-time (ReDoS-safe) regex engine for String regex methods.
regex = "1.13"

# Data structures
indexmap = { version = "2.14.2", features = ["serde"] }
rustc-hash = "2.1"

# Error handling
thiserror = "2.0.18"

# Testing
insta = { version = "1.49.0", features = ["yaml"] }

# Benchmarking
divan = "0.1.21"

# Python bindings
pyo3 = { version = "0.30", features = ["extension-module"] }

# WASM bindings
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"

# Whole-program optimization for shipped builds (as ruff and uv do). Panics
# stay "unwind": napi-rs and pyo3 turn them into host exceptions.
[profile.release]
lto = "fat"
codegen-units = 1

# Release builds plus symbols, for samply / flamegraphs:
#   cargo build --profile profiling --example profile_agent
[profile.profiling]
inherits = "release"
debug = true
# Faster to build than fat LTO; good enough for flame graphs.
lto = "thin"
codegen-units = 16
